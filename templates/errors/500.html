{% extends "base.html" %}

{% block title %}Server Error - CineReview{% endblock %}

{% block content %}
<!-- 500 ERROR PAGE -->
<div class="container text-center py-5">
    <div class="error-page">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        </div>

        <h1 class="display-4 fw-bold text-danger mb-3">500</h1>
        <h2 class="h3 mb-4">Internal Server Error</h2>

        <p class="lead mb-4">
            Something went wrong on our server. Our team has been notified and is working to fix the issue.
        </p>

        <!-- ACTION BUTTONS -->
        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-4">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <a href="{{ url_for('movies') }}" class="btn btn-outline-primary btn-lg px-4">
                <i class="bi bi-film me-2"></i>Browse Movies
            </a>
            <button onclick="window.history.back()" class="btn btn-outline-secondary btn-lg px-4">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
